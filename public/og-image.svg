<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="#0f172a"/>
  
  <!-- Subtle Grid Accent -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#grid)" opacity="0.6"/>

  <!-- Left Accent Bar -->
  <rect x="96" y="140" width="6" height="350" rx="3" fill="#059669"/>

  <!-- Content Container -->
  <g transform="translate(130, 0)">
    <!-- Badge -->
    <rect x="0" y="160" width="220" height="36" rx="18" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="18" y="183" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#34d399" letter-spacing="1.5">KENYA • EAST AFRICA</text>

    <!-- Brand Name & Headline -->
    <text x="0" y="260" font-family="system-ui, -apple-system, sans-serif" font-size="56" font-weight="800" fill="#ffffff" letter-spacing="-1">
      Karani <tspan fill="#34d399">Systems</tspan>
    </text>

    <!-- Tagline / Subtitle -->
    <text x="0" y="325" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="500" fill="#94a3b8">
      Digital Engineering • Web GIS • Field Data Pipelines
    </text>

    <!-- Feature Pillars -->
    <g transform="translate(0, 420)">
      <text x="0" y="0" font-family="system-ui, -apple-system, monospace" font-size="16" fill="#cbd5e1">
        <tspan fill="#34d399">✓</tspan> Daraja M-Pesa STK   <tspan fill="#34d399" dx="20">✓</tspan> Interactive GIS Maps   <tspan fill="#34d399" dx="20">✓</tspan> Offline KoboToolbox
      </text>
      <text x="0" y="36" font-family="system-ui, -apple-system, monospace" font-size="15" fill="#64748b">
        karani-systems.pages.dev
      </text>
    </g>
  </g>
</svg>
